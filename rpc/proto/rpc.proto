syntax = "proto3";

package somewear.rpc;
option go_package = "somewear/rpc/proto;rpcpb";

// Envelope is the top-level payload carried inside every IPv4Datagram.
// request_id correlates async responses back to their originating request.
// namespace must equal EnvelopeNamespace; packets without it are discarded.
message Envelope {
  string namespace   = 1;
  uint32 request_id  = 2;
  uint64 session_id  = 6;
  oneof payload {
    RpcRequest  request  = 3;
    RpcResponse response = 4;
  }
}

enum SessionChannel {
  SESSION_CHANNEL_UNSPECIFIED = 0;
  RADIO = 1;
  SATELLITE = 2;
  CELLULAR = 3;
  MESH = 4;
}

// RpcRequest carries a single method call. Add new methods here as a new oneof field.
message RpcRequest {
  oneof method {
    ExecRequest      exec      = 1;
    ConnectRequest   connect   = 2;
    DiscoverRequest  discover  = 3;
    PingRequest      ping      = 4;
    DisconnectRequest disconnect = 6;
  }
}

// RpcResponse carries the result of an RpcRequest or a transport-level error.
message RpcResponse {
  oneof result {
    ExecResponse      exec      = 1;
    RpcError          error     = 2;
    ConnectResponse   connect   = 3;
    DiscoverResponse  discover  = 4;
    PingResponse      ping      = 5;
  }
}

// --- Exec ---

message ExecRequest {
  string command = 1;
}

message ExecResponse {
  string output    = 1;
  int32  exit_code = 2;
  bool   truncated = 3;
}

// --- Connect ---

message ConnectRequest {
  uint64 session_id = 1;
  repeated SessionChannel channels = 2;
}

message ConnectResponse {
  string hostname = 1;
  repeated string ip_addresses = 2;
  string arch = 3;
  string cpu_model = 4;
  int32  cpu_count = 5;
  uint64 session_id = 6;
  repeated SessionChannel channels = 7;
}

message DisconnectRequest {}

// --- Ping ---

// The four ping timestamps use Unix milliseconds so each direction can be
// shown when peer clocks are synchronized. RTT only uses the client's clock.
message PingRequest {
  int64 client_send_unix_millis = 1;
}

message PingResponse {
  int64 target_receive_unix_millis = 1;
  int64 target_send_unix_millis = 2;
  // Echoed from Beam's inbound webhook timestamp. Together with the source
  // account and package type, this reconstructs the request datagram ID.
  int64 client_package_send_unix_seconds = 3;
  int64 client_account_id = 4;
}

// --- Discovery ---

// DiscoverRequest is broadcast to a workspace. response_jitter_ms asks peers
// to spread their replies over a bounded window instead of responding at once.
// When channels is non-empty, both the probe and its response must use exactly
// that channel set.
message DiscoverRequest {
  uint32 response_jitter_ms = 1;
  repeated SessionChannel channels = 2;
}

// The sender's Beam account ID is deliberately omitted because Beam supplies
// it in the webhook metadata. Keep this response small for satellite links.
message DiscoverResponse {
  uint32 protocol_version = 1;
  string hostname = 2;
  string arch = 3;
  uint32 capabilities = 4;
  repeated SessionChannel channels = 5;
}

// --- Error ---

message RpcError {
  string message = 1;
}
