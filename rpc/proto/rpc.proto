syntax = "proto3";

package somewear.rpc;
option go_package = "somewear/rpc/proto;rpcpb";

// Envelope is the top-level payload carried inside every IPv4Datagram.
// request_id correlates async responses back to their originating request.
// namespace must equal EnvelopeNamespace; packets without it are discarded.
message Envelope {
  string namespace   = 1;
  uint32 request_id  = 2;
  uint64 session_id  = 6;
  oneof payload {
    RpcRequest      request     = 3;
    RpcResponse     response    = 4;
    GridStreamFrame grid_stream = 5;
  }
}

enum SessionChannel {
  SESSION_CHANNEL_UNSPECIFIED = 0;
  RADIO = 1;
  SATELLITE = 2;
  CELLULAR = 3;
  MESH = 4;
}

// GridStreamFrame multiplexes ordered byte streams over IPv4Datagram delivery.
// stream_id is scoped to the authenticated source account. The webhook account
// metadata supplies peer identity and is never accepted from this payload.
message GridStreamFrame {
  uint32 stream_id = 1;
  oneof payload {
    GridStreamOpen       open        = 2;
    GridStreamAccept     accept      = 3;
    GridStreamData       data        = 4;
    GridStreamAck        ack         = 5;
    GridStreamHalfClose  half_close  = 6;
    GridStreamClose      close       = 7;
    GridStreamReset      reset       = 8;
  }
}

message GridStreamOpen {
  uint32 protocol_version = 1;
  string service = 2;
  uint32 receive_window_bytes = 3;
}

message GridStreamAccept {
  uint32 receive_window_bytes = 1;
}

message GridStreamData {
  uint64 offset = 1;
  bytes payload = 2;
}

// received_offset cumulatively acknowledges all bytes below the offset.
// receive_window_bytes is the additional capacity available from that offset.
message GridStreamAck {
  uint64 received_offset = 1;
  uint32 receive_window_bytes = 2;
}

message GridStreamHalfClose {
  uint64 final_offset = 1;
}

message GridStreamClose {
  uint64 final_offset = 1;
  int32 exit_code = 2;
  string message = 3;
}

message GridStreamReset {
  Reason reason = 1;
  string message = 2;

  enum Reason {
    REASON_UNSPECIFIED = 0;
    PEER_UNAVAILABLE = 1;
    PROTOCOL_ERROR = 2;
    CANCELLED = 3;
    INTERNAL_ERROR = 4;
  }
}

// RpcRequest carries a single method call. Add new methods here as a new oneof field.
message RpcRequest {
  oneof method {
    ExecRequest      exec      = 1;
    ConnectRequest   connect   = 2;
    DiscoverRequest  discover  = 3;
    PingRequest      ping      = 4;
    PutRequest       put       = 5;
    DisconnectRequest disconnect = 6;
  }
}

// RpcResponse carries the result of an RpcRequest or a transport-level error.
message RpcResponse {
  oneof result {
    ExecResponse      exec      = 1;
    RpcError          error     = 2;
    ConnectResponse   connect   = 3;
    DiscoverResponse  discover  = 4;
    PingResponse      ping      = 5;
    PutResponse       put       = 6;
  }
}

// --- Exec ---

message ExecRequest {
  string command = 1;
  bool stream_output = 2;
}

message ExecResponse {
  string output    = 1;
  int32  exit_code = 2;
  bool   truncated = 3;
}

// --- Connect ---

message ConnectRequest {
  uint64 session_id = 1;
  repeated SessionChannel channels = 2;
}

message ConnectResponse {
  string hostname = 1;
  repeated string ip_addresses = 2;
  string arch = 3;
  string cpu_model = 4;
  int32  cpu_count = 5;
  uint64 session_id = 6;
  repeated SessionChannel channels = 7;
}

message DisconnectRequest {}

// --- Ping ---

// The four ping timestamps use Unix milliseconds so each direction can be
// shown when peer clocks are synchronized. RTT only uses the client's clock.
message PingRequest {
  int64 client_send_unix_millis = 1;
}

message PingResponse {
  int64 target_receive_unix_millis = 1;
  int64 target_send_unix_millis = 2;
  // Echoed from Beam's inbound webhook timestamp. Together with the source
  // account and package type, this reconstructs the request datagram ID.
  int64 client_package_send_unix_seconds = 3;
  int64 client_account_id = 4;
}

// --- File upload ---

// PutRequest transfers one acknowledged chunk. Repeating a chunk at an
// already-acknowledged offset is safe, which makes Beam webhook retries
// idempotent.
message PutRequest {
  string transfer_id = 1;
  string name = 2;
  uint32 mode = 3;
  uint64 offset = 4;
  uint64 total_size = 5;
  bytes data = 6;
  bool complete = 7;
}

message PutResponse {
  uint64 next_offset = 1;
  string path = 2;
  bool complete = 3;
}

// --- Discovery ---

// DiscoverRequest is broadcast to a workspace. response_jitter_ms asks peers
// to spread their replies over a bounded window instead of responding at once.
// When channels is non-empty, both the probe and its response must use exactly
// that channel set.
message DiscoverRequest {
  uint32 response_jitter_ms = 1;
  repeated SessionChannel channels = 2;
}

// The sender's Beam account ID is deliberately omitted because Beam supplies
// it in the webhook metadata. Keep this response small for satellite links.
message DiscoverResponse {
  uint32 protocol_version = 1;
  string hostname = 2;
  string arch = 3;
  uint32 capabilities = 4;
  repeated SessionChannel channels = 5;
}

// --- Error ---

message RpcError {
  string message = 1;
}
